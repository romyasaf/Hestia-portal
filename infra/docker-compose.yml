version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: property_ops_postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: property_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: property_ops_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
