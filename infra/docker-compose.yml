services:
  postgres:
    image: postgres:15
    container_name: property_ops_postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: property_ops
    ports:
      - "5432:5432"
    volumes:
      # Data only. Do not mount ../db here: Postgres would run schema.sql on first boot,
      # then README step 4 would apply schema again and hit "already exists" errors.
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: property_ops_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
